# Apple Silicon (arm64) override.
#
# The base compose.yaml hardcodes `platform: linux/amd64` on every service,
# which forces Compose to pull amd64 images on an arm64 host. This override
# flips all services to `linux/arm64` so the locally built arm64 image is used.
#
# Only include this override on arm64 hosts (e.g. Mac M-series). On amd64
# servers, omit it and keep the default amd64 platform.
services:
  configurator:
    platform: linux/arm64
  backend:
    platform: linux/arm64
  frontend:
    platform: linux/arm64
  websocket:
    platform: linux/arm64
  queue-short:
    platform: linux/arm64
  queue-long:
    platform: linux/arm64
  scheduler:
    platform: linux/arm64
  db:
    platform: linux/arm64
  redis-cache:
    platform: linux/arm64
  redis-queue:
    platform: linux/arm64
