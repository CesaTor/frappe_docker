# Local dev — single file, no -f merging, no rendered artifact.
# ponytail: no platform pin — runs natively on Apple Silicon (arm64) and amd64; no override file needed.
# Usage:
#   docker compose --env-file deploy/.env -f deploy/docker-compose.local.yaml up -d --pull=missing
#   Open http://erp.localhost:8080 (and crm/helpdesk.localhost) — no proxy.

name: frappe

services:
  db:
    image: mariadb:11.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-external-locking
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123}
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

  redis-cache:
    image: redis:8.6-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:8.6-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  configurator:
    image: ${CUSTOM_IMAGE:-frappe-requrv}:${CUSTOM_TAG:-16}
    pull_policy: ${PULL_POLICY:-missing}
    restart: on-failure
    entrypoint: [bash, -c]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: 9000
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  backend:
    image: ${CUSTOM_IMAGE:-frappe-requrv}:${CUSTOM_TAG:-16}
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      configurator:
        condition: service_completed_successfully

  frontend:
    image: ${CUSTOM_IMAGE:-frappe-requrv}:${CUSTOM_TAG:-16}
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-$$host}
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER:-X-Forwarded-For}
      UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE:-off}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    ports:
      - ${HTTP_PUBLISH_PORT:-8080}:8080
    depends_on:
      - backend
      - websocket

  websocket:
    image: ${CUSTOM_IMAGE:-frappe-requrv}:${CUSTOM_TAG:-16}
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    image: ${CUSTOM_IMAGE:-frappe-requrv}:${CUSTOM_TAG:-16}
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    command: [bench, worker, --queue, "short,default"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-long:
    image: ${CUSTOM_IMAGE:-frappe-requrv}:${CUSTOM_TAG:-16}
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    command: [bench, worker, --queue, "long,default,short"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      configurator:
        condition: service_completed_successfully

  scheduler:
    image: ${CUSTOM_IMAGE:-frappe-requrv}:${CUSTOM_TAG:-16}
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    command: [bench, schedule]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      configurator:
        condition: service_completed_successfully

  # Daily full dump into host-visible folder (keep 7, every 24h).
  db-backup:
    image: mariadb:11.8
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "[db-backup] waiting for db..."
        until mariadb -h "$$DB_HOST" -P "$$DB_PORT" -e 'SELECT 1' >/dev/null 2>&1; do sleep 5; done
        while :; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          if mariadb-dump -h "$$DB_HOST" -P "$$DB_PORT" --all-databases --routines --triggers --skip-lock-tables | gzip > "/backups/db-$$ts.sql.gz"; then
            echo "[db-backup] wrote /backups/db-$$ts.sql.gz"
            ls -1t /backups/db-*.sql.gz 2>/dev/null | tail -n +$$(($$KEEP_BACKUPS + 1)) | xargs -r rm -f
          else
            echo "[db-backup] dump FAILED" >&2
            rm -f "/backups/db-$$ts.sql.gz"
          fi
          sleep $$(($$BACKUP_INTERVAL_HOURS * 3600))
        done
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_PWD: ${DB_PASSWORD:-123}
      BACKUP_INTERVAL_HOURS: "24"
      KEEP_BACKUPS: "7"
    volumes:
      - db-backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  sites:
    driver: local
    driver_opts:
      type: bind
      device: ${FRAPPE_DATA_DIR:-./deploy/docker_data}/sites
      o: bind
  redis-queue-data:
    driver: local
    driver_opts:
      type: bind
      device: ${FRAPPE_DATA_DIR:-./deploy/docker_data}/redis-queue
      o: bind
  db-backups:
    driver: local
    driver_opts:
      type: bind
      device: ${FRAPPE_DATA_DIR:-./deploy/docker_data}/db-backups
      o: bind
  db-data:
